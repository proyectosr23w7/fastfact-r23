---
deployment:
  tasks:
    - echo "===== Iniciando deploy FastFact R23 ====="

    - export REPOPATH=/home/proyect2/repositories/fastfact-r23
    - export DEPLOYPATH=/home/proyect2/facturacionr23.proyectosr23w7.com

    - echo "Repositorio base:"
    - echo $REPOPATH
    - echo "Destino del subdominio facturacionr23.proyectosr23w7.com:"
    - echo $DEPLOYPATH

    - mkdir -p $DEPLOYPATH

    - /usr/bin/rsync -av --delete --exclude='.git' --exclude='.env' --exclude='storage/app/private/siat/certificados/*' --exclude='storage/backups/*' --exclude='storage/logs/*' $REPOPATH/ $DEPLOYPATH/

    - cd $DEPLOYPATH
    - php artisan migrate --force || true

    - echo "===== Deploy finalizado FastFact R23 ====="
